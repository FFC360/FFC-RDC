  p.I.forEach(i=>{const v=parseFloat(dg.querySelector('[data-iv="'+i.w+'"]').value),c=dg.querySelector('[data-ic="'+i.w+'"]').value.trim();if(!isNaN(v)||c)it.push({w:i.w,v:isNaN(v)?0:v,c})});
  it.forEach(x=>{if(x.v)(R[x.w]=R[x.w]||[]).push({d,v:x.v,c:x.c||'Mise à jour avancement',u:ME||'Anonyme',av:id})});calc();
  const a={id,p:w,d,s:$('#ad2').value,t:Math.round(p.pr),r:$('#ad4').value.trim(),f:$('#ad5').value.trim(),n:$('#ad6').value.trim(),u:ME||'Anonyme',i:it};
  AV().push(a);log('Mise à jour avancement',p.o,a.s+' · '+N(a.t)+'% · '+it.length+' indicateur(s) renseigné(s)',{t:'avn',id});save();sv2();dg.close()}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-av],[data-avd]');if(!b)return;e.preventDefault();if(b.dataset.av)avEdit(b.dataset.av);else{const a=AV().find(x=>x.id==b.dataset.avd);if(!a)return;avRm(a);log('Suppression avancement',(D.P.find(p=>p.w==a.p)||{}).o,a.s+' · '+N(a.t)+'%'+((a.i||[]).some(x=>x.v)?' (valeurs retirées du réalisé)':''),{t:'avd',a});draw()}});
function avRep(P){const L=P.map(p=>[p,lastAv(p.w)]).filter(x=>x[1]);return '<h3 style="font-size:15px;margin:18px 0 6px">État d’avancement par projet</h3>'+(L.length?'<div class="tw"><table><tr><th>Projet</th><th>État</th><th>Taux déclaré</th><th>Taux calculé</th><th>Réalisations</th><th>Indicateurs mis à jour</th><th>Difficultés</th><th>Prochaines étapes</th></tr>'+L.map(([p,a])=>'<tr><td><b>'+esc(p.o)+'</b><br><span class="mu">'+a.d+' · '+esc(a.u||'')+'</span></td><td><span class="tag '+AVC[a.s]+'">'+esc(a.s)+'</span></td><td style="min-width:110px"><div class="bar"><i style="width:'+Math.min(100,a.t)+'%"></i></div>'+N(a.t)+'%</td><td>'+N(p.pr)+'%</td><td>'+esc(a.r||'')+'</td><td>'+avInd(a)+'</td><td>'+esc(a.f||'')+'</td><td>'+esc(a.n||'')+'</td></tr>').join('')+'</table></div>':'<p class="mu">Aucune mise à jour d’avancement enregistrée.</p>')}
async function dl(name,data){try{const d=await claude.use('downloads');if(d)return d.save({filename:name,data});}catch(e){}alert('Téléchargement indisponible dans ce contexte.')}
$('#csv').onclick=()=>{const q=s=>'"'+String(s).replace(/"/g,'""')+'"';dl('suivi_indicateurs_2026.csv','\ufeff'+['OSC;Projet;Province;Bailleur;Code;Indicateur;Cible;Réalisé;%'].concat(D.I.map(i=>{const p=D.P.find(x=>x.w==i.p);return[q(p.o),q(p.n),q(p.pv),q(p.f),i.w,q(i.l),i.t,real(i),N(pct(i))].join(';')})).join('\n'))};
$('#bk').onclick=()=>dl('sauvegarde_suivi.json',JSON.stringify({realise:R,projets:S},null,1));
conn();
